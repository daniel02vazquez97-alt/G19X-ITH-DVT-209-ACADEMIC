# nginx de la imagen `frontend` (U7, `DT-095`): sirve el build de React y reenvía `/api/` a la API en el
# mismo origen (`DT-070` punto 23), de modo que la API no necesita CORS. Corre sin privilegios: puerto
# 8080, PID y temporales en /tmp, registros a la salida estándar.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # API V1 (servicio `api` de infra/docker-compose.yml). La cabecera Authorization pasa sin cambios.
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Archivos con huella generados por Vite.
        location /assets/ {
            try_files $uri =404;
        }

        # Rutas del enrutador del navegador (react-router): cualquier otra ruta devuelve la aplicación.
        location / {
            try_files $uri /index.html;
        }
    }
}
